name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Use placeholder secrets
        run: cp src/secrets.example.h src/secrets.h
      - name: Build the recorder and the 2.13" bench variant
        run: pio run -e recorder -e bench213
      - name: Render every screen on the desktop
        run: |
          pip install pillow
          ../tools/screen-preview/build.sh recorder
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: tools/screen-preview/out-recorder/*.png
      - name: Check the Mac receiver parses
        run: python -m py_compile ../mac/receiver.py

  case:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render every part (fails if a fit assert trips)
        run: |
          mkdir -p out
          for p in back front button; do
            openscad --hardwarnings -D "part=\"$p\"" -o out/$p.stl recorder.scad
          done
          openscad --hardwarnings -D 'part="clip"' -D with_clip=true -o out/clip-optional.stl recorder.scad
          openscad --hardwarnings -D 'part="back"' -D with_clip=true -o out/back-for-clip.stl recorder.scad
      - uses: actions/upload-artifact@v4
        with:
          name: recorder-stl
          path: cad/out/*.stl
