name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Use placeholder secrets
        run: cp include/secrets.example.h include/secrets.h
      - run: pio run
      - name: Report size
        run: pio run -t size | tail -n 5

  dictation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-dictation-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Use placeholder secrets
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run
      - name: Check the Mac receiver parses
        run: python -m py_compile ../mac/receiver.py

  pen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pen/firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pen-${{ hashFiles('pen/firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Use placeholder secrets
        run: cp src/secrets.example.h src/secrets.h
      - name: Build the pen and the 2.13" bench variant
        run: pio run -e pen -e bench213

  pen-case:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pen/cad
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render every part (fails if a fit assert trips)
        run: |
          mkdir -p out
          for p in body sled cap plunger clip; do
            openscad --hardwarnings -D "part=\"$p\"" -o out/$p.stl pen.scad
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pen-stl
          path: pen/cad/out/*.stl
