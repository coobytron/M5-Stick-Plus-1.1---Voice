; M5StickC Plus 1.1 dictation firmware
; Build:  pio run          Flash:  pio run -t upload       Logs:  pio device monitor

[env:m5stick-c-plus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified@0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
