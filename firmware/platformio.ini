; Voice pen firmware: Seeed XIAO ESP32-S3 Sense + 0.97" e-ink
; Build:  pio run          Flash:  pio run -t upload       Logs:  pio device monitor
;
; The pen deep-sleeps between recordings, which drops USB. To flash, hold the
; XIAO's B (boot) button while plugging it in.

[platformio]
default_envs = pen

[env]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@1.6.9
build_flags =
    -DCORE_DEBUG_LEVEL=1

; The pen itself: Good Display GDEM0097T61, 0.97" 184 x 88, SSD1680.
[env:pen]
build_flags =
    ${env.build_flags}
    -DPEN_DISPLAY_097

; Bench build for a common 2.13" 122 x 250 SSD1680 module (GDEY0213B74 or a
; WeAct 2.13" board). Same wiring; handy for testing before the 0.97" arrives.
[env:bench213]
build_flags =
    ${env.build_flags}
    -DPEN_DISPLAY_213
