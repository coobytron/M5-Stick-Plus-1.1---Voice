; M5StickC Plus 1.1 voice recorder and translator
[env:m5stick-c-plus]
platform = espressif32@6.9.0
; The Plus uses the same ESP32-PICO-D4 module as the original StickC.
board = m5stick-c
framework = arduino
; 3 MB app, ~900 KB LittleFS for the recording.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=1
